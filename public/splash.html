<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nook is starting…</title>
<style>
  :root {
    --bg0: #16121d;
    --bg1: #1d1724;
    --panel: #241d2e;
    --line: #3a3147;
    --ink: #f2edf7;
    --dim: #a89fc0;
    --faint: #6f6787;
    --accent: #a8e05f;
    --accent-ink: #233014;
    --danger: #e08a6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", ui-rounded, system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% -10%, var(--bg1) 0%, var(--bg0) 62%),
                var(--bg0);
    color: var(--ink);
    display: grid;
    place-items: center;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  /* faint twinkling stars */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #cdbfe8; opacity: 0.18; animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .12 } 50% { opacity: .38 } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 0; padding-bottom: 4vh; }

  /* pixel pet, drawn as box-shadow art, gentle breathe */
  .pet { width: 8px; height: 8px; margin-bottom: 26px; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }

  .wordmark {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
  }
  .wordmark .n {
    font-size: 34px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--ink);
  }
  .wordmark .v {
    font-size: 12px; color: var(--faint); letter-spacing: 0.08em;
  }

  .status { font-size: 14.5px; color: var(--dim); height: 22px; letter-spacing: 0.02em; }
  .status .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: "" } 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }

  .bar {
    width: 220px; height: 5px; border-radius: 99px; margin-top: 18px;
    background: var(--panel); border: 1px solid var(--line); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 40%; border-radius: 99px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }

  .foot {
    position: fixed; bottom: 18px; font-size: 11.5px; color: var(--faint); letter-spacing: 0.06em;
  }

  /* error card */
  .err {
    display: none; flex-direction: column; align-items: center; gap: 10px;
    max-width: 380px; margin-top: 26px; padding: 20px 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 18px 50px -18px rgba(0,0,0,.6);
    animation: pop .25s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px) } to { opacity: 1; transform: none } }
  .err.show { display: flex; }
  .err .t { font-size: 16px; font-weight: 700; color: var(--danger); }
  .err .m { font-size: 13px; color: var(--dim); text-align: center; line-height: 1.55; overflow-wrap: anywhere; }
  .err .h { font-size: 11px; color: var(--faint); }
  .err .row { display: flex; gap: 10px; margin-top: 6px; }
  .err button {
    font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg1); color: var(--ink); cursor: pointer;
    transition: all .15s ease;
  }
  .err button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .err button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .err button.primary:hover { color: var(--accent-ink); filter: brightness(1.06); }

  .fade { transition: opacity .28s ease; }
  .fade.out { opacity: 0; }
</style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <div class="wrap fade" id="wrap">
    <div class="pet" id="pet" aria-hidden="true"></div>
    <div class="wordmark"><span class="n">Nook</span><span class="v" id="ver"></span></div>
    <div class="status"><span id="msg">Warming up your cozy corner</span><span class="dots" id="dots"></span></div>
    <div class="bar" id="bar"><i></i></div>

    <div class="err" id="err" role="alert">
      <div class="t">Nook's engine didn't start</div>
      <div class="m" id="errmsg">Something went wrong while launching the embedded workspace server.</div>
      <div class="h" id="errhint">Logs live at %LOCALAPPDATA%\Nook\server.log</div>
      <div class="row">
        <button class="primary" id="retry">Try again</button>
        <button id="logs">Open logs folder</button>
      </div>
    </div>
  </div>

  <div class="foot">local workspace · offline-first · your notes never leave this PC</div>

<script>
  // ---- tiny stars ----
  (function () {
    var s = document.getElementById('stars');
    for (var i = 0; i < 34; i++) {
      var el = document.createElement('i');
      el.style.left = (Math.random() * 100) + '%';
      el.style.top = (Math.random() * 100) + '%';
      el.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      s.appendChild(el);
    }
  })();

  // ---- pixel pet (lime bean with face) rendered as box-shadow pixel art ----
  (function () {
    var M = [
      '............',
      '...LLLLLL...',
      '..LLLLLLLL..',
      '.LLLLLLLLLL.',
      '.LLWWLLWWLL.',
      '.LLEWLLLEWL.',
      '.LLLLLLLLLL.',
      '.LLDsLLsDLL.',
      '..DLLLLLLD..',
      '...DDDDDD...',
    ];
    var C = {
      L: '#a8e05f', // lime body
      D: '#7cb342', // shade
      E: '#20210f', // eye pupil
      W: '#f4ffe0', // eye white
      s: '#4e7927'  // smile
    };
    var unit = 6, el = document.getElementById('pet'), shadows = [];
    for (var y = 0; y < M.length; y++) {
      for (var x = 0; x < M[y].length; x++) {
        var ch = M[y][x];
        if (ch === '.') continue;
        var cx = (x - M[y].length / 2 + 0.5) * unit;
        var cy = (y - M.length / 2 + 0.5) * unit;
        shadows.push(cx + 'px ' + cy + 'px 0 0 ' + C[ch]);
      }
    }
    el.style.boxShadow = shadows.join(',');
    el.style.marginLeft = '0px';
    el.style.marginTop = '0px';
    el.style.transformOrigin = 'center';
    // wrap in a sized box so breathing translate stays centered
    el.style.position = 'relative';
    el.style.left = '50%';
    el.style.top = '4px';
    el.style.marginLeft = (-M[0].length * unit / 2) + 'px';
  })();

  // ---- boot bridge: the Rust shell drives the UI through these ----
  var wrap = document.getElementById('wrap');
  var dots = document.getElementById('dots');
  var msg = document.getElementById('msg');
  var bar = document.getElementById('bar');
  var err = document.getElementById('err');

  window.__NOOK_BOOT__ = {
    /** update the status line */
    state: function (text, withDots) {
      err.classList.remove('show');
      bar.style.display = 'block';
      dots.style.display = withDots === false ? 'none' : 'inline';
      msg.textContent = text || 'Working…';
      wrap.classList.remove('out');
    },
    /** engine is healthy — hand off to the real app */
    done: function (port) {
      msg.textContent = 'Ready — opening your Nook';
      dots.style.display = 'none';
      bar.style.display = 'none';
      setTimeout(function () {
        wrap.classList.add('out');
        setTimeout(function () {
          window.location.replace('http://127.0.0.1:' + port + '/');
        }, 260);
      }, 340);
    },
    /** engine failed after all retries */
    fail: function (text, hint) {
      bar.style.display = 'none';
      dots.style.display = 'none';
      msg.textContent = '';
      document.getElementById('errmsg').textContent = text ||
        'Something went wrong while launching the embedded workspace server.';
      document.getElementById('errhint').textContent = hint ||
        'Logs live at %LOCALAPPDATA%\\Nook\\server.log';
      err.classList.add('show');
    }
  };

  document.getElementById('retry').addEventListener('click', function () {
    window.location.reload();
  });
  document.getElementById('logs').addEventListener('click', function () {
    try {
      var t = window.__TAURI__;
      if (t && t.core && t.core.invoke) t.core.invoke('open_data_folder');
    } catch (e) { /* noop */ }
  });

  // show version from the shell if available
  (function () {
    var v = document.getElementById('ver');
    try {
      var t = window.__TAURI__;
      if (t && t.core && t.core.invoke) {
        t.core.invoke('app_version').then(function (s) { v.textContent = 'v' + s; }).catch(function () {});
      }
    } catch (e) { /* noop */ }
  })();
</script>
</body>
</html>
