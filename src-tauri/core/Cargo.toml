[package]
name = "nook-core"
version = "1.2.0"
edition = "2021"
description = "Nook backend core: SQLite vault, API router, AI client, agent tools, MCP server, team room"
license = "MIT"
publish = false

[lib]
name = "nook_core"
path = "src/lib.rs"

[[bin]]
name = "nook-mcp"
path = "src/bin/nook-mcp.rs"

[[bin]]
name = "nook-dev-api"
path = "src/bin/nook-dev-api.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
