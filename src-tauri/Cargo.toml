[package]
name = "nook"
version = "0.2.1"
edition = "2021"
description = "Nook — pixel notes with a tiny friend (Tauri desktop shell)"
authors = ["Nook"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 desktop shell. `tray-icon` enables the system tray (minimize-to-tray),
# `image-png` lets us decode icons/icon.png for the tray icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# JSON payloads for commands / window state
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Needed to parse the localhost URL the embedded Next.js server runs on
url = "2"

[profile.release]
# Smaller, faster installer. Strip debug symbols.
strip = true
opt-level = "z"
lto = true
panic = "abort"

[[bin]]
name = "Nook"
path = "src/main.rs"
