name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: cargo test -p nook-core --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --workspace --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - run: cargo test -p nook-core --manifest-path src-tauri/Cargo.toml

      # On a v* tag: builds and publishes a GitHub Release with the installers.
      - name: Build (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOOK_UPDATER_PUBKEY: ${{ secrets.NOOK_UPDATER_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nook ${{ github.ref_name }}
          releaseBody: Download Nook_x64-setup.exe below and run it. Windows 10/11.
          releaseDraft: false
          prerelease: false

      # On every other push/PR: just build the installers as artifacts.
      - name: Build (artifacts)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          NOOK_UPDATER_PUBKEY: ${{ secrets.NOOK_UPDATER_PUBKEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Nook-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/nook-mcp.exe
          if-no-files-found: error
