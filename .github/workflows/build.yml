name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          # libdbus-1-dev: the keyring crate (secret-service) links libdbus — missing it broke the
          # Linux check; ayatana is the indicator lib Tauri v2 uses on Ubuntu 22.04
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: cargo test -p nook-core --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --workspace --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - run: cargo test -p nook-core --manifest-path src-tauri/Cargo.toml

      # On a v* tag: builds, SIGNS (updater) and publishes a GitHub Release with the installers
      # and latest.json (what the in-app updater reads:
      # https://github.com/MrRealORG/Nook/releases/latest/download/latest.json).
      # Required repo secrets: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
      # empty if the key has no password). The public key is in tauri.conf.json.
      - name: Build, sign & release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nook ${{ github.ref_name }}
          releaseBody: Download the Nook x64 setup .exe below and run it (Windows 10/11). Existing installs update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Every other push / PR: unsigned installers as artifacts. Updater artifacts are switched
      # off here so the build does not need the signing key (fork PRs have no secrets) — with
      # createUpdaterArtifacts=true and no private key, `tauri build` fails.
      - name: Build (artifacts)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config {"bundle":{"createUpdaterArtifacts":false}}

      - uses: actions/upload-artifact@v4
        with:
          name: Nook-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
