name: Windows build (v1.4)

# Builds the unsigned Tauri NSIS installer on Windows for the v1.4-fixes branch, so the
# Windows-only code (UI Automation address bar, SetWinEventHook foreground hook, Shield
# enforcement, WASAPI meeting recorder) is compiled and tested on a real MSVC toolchain.
on:
  workflow_dispatch:
  push:
    branches: [v1.4-fixes]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false  # one running + newest pending; older pending runs are superseded

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - name: cargo check (Windows, all targets)
        run: cargo check --workspace --all-targets --manifest-path src-tauri/Cargo.toml
      - name: cargo test nook-core (Windows)
        run: cargo test -p nook-core --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer (unsigned, no updater artifacts)
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: Nook-1.4-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
