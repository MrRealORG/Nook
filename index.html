<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0e10" />
    <link rel="icon" href="/logo.svg" />
    <title>Nook — pixel notes with a tiny friend</title>
    <script>
      try { var p = JSON.parse(localStorage.getItem("nook:prefs") || "{}"); document.documentElement.dataset.theme = p.theme || "graphite"; if (p.grain === false) document.documentElement.dataset.grain = "off"; } catch (e) {}
    </script>
  </head>
  <body>
    <div class="backdrop"></div>
    <div id="root"></div>
    <div class="grain"></div>
    <div class="noise"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
